<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceAccess · Panel</title>
  <style>
    :root {
  --texto: #102b4e;
  --primario: #1769aa;
  --primario-oscuro: #124f91;
  --peligro: #b42332;
  --ok: #087443;
  --borde: #b9d5e9;
  --blanco: #ffffff;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  min-height: 100vh;
  margin: 0;
  padding: 22px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  color: var(--texto);
  background: linear-gradient(115deg, #69a8e5 0%, #83c5ef 48%, #a6e5f7 100%);
}
header {
  max-width: 1100px;
  margin: 0 auto 24px;
  padding: 18px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.42);
  border-radius: 24px;
  box-shadow: 0 8px 24px rgba(20,72,125,.12);
  text-align: center;
}
.logo-faceaccess {
  display: block;
  width: 178px;
  height: 178px;
  object-fit: cover;
  border-radius: 50%;
  filter: drop-shadow(0 4px 8px rgba(12,54,99,.14));
}
header h1 { margin: 0; color: #103c70; font-size: clamp(22px, 3vw, 30px); }
header .sesion {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  color: #173d67;
}
main { max-width: 1000px; margin: 0 auto; padding: 0 4px 30px; }
section {
  padding: 26px;
  margin-bottom: 22px;
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 22px;
  box-shadow: 0 10px 28px rgba(23,75,125,.15);
}
h2 { margin: 0 0 20px; color: #14528b; text-align: center; font-size: 23px; }
h3 { color: #14528b; margin: 24px 0 12px; }
label { display: block; font-weight: 600; margin: 16px 0 7px; color: #24496d; }
input[type=text] {
  width: 100%;
  min-height: 44px;
  padding: 10px 18px;
  border: 1px solid #a8c5d9;
  border-radius: 24px;
  background: #fff;
  color: #263746;
  font-size: 16px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.10);
}
input[type=text]:focus { outline: 3px solid rgba(37,130,197,.22); border-color: #287fbd; }
button, .boton {
  display: inline-block;
  padding: 11px 22px;
  border: 1px solid #0d5797;
  border-radius: 28px;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(180deg, #398ed0, #1767a8);
  box-shadow: 0 3px 0 #0e4c83, 0 5px 12px rgba(20,78,130,.20);
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  transition: transform .15s ease, filter .15s ease;
}
button:hover, .boton:hover { filter: brightness(1.06); transform: translateY(-1px); }
button:active, .boton:active { transform: translateY(1px); box-shadow: 0 1px 0 #0e4c83; }
button.peligro { background: linear-gradient(180deg, #d85c68, #ae2638); border-color: #9f2030; box-shadow: 0 3px 0 #841b2a; }
button.gris { background: linear-gradient(180deg, #8299ad, #526c82); border-color: #49647a; box-shadow: 0 3px 0 #3b5368; }
button.salir { color: #15548a; background: #fff; border-color: #b4d0e4; box-shadow: 0 3px 0 #9bbbd3; }
:focus-visible { outline: 3px solid #ffbd45; outline-offset: 3px; }
.consentimiento { border: 1px solid #c5dceb; border-radius: 16px; padding: 14px; margin-top: 18px; background: #f5fbff; }
.consentimiento label { display: flex; gap: 10px; align-items: flex-start; font-weight: normal; margin: 0; line-height: 1.45; }
.consentimiento input { width: 21px; height: 21px; flex: none; margin-top: 2px; accent-color: #1769aa; }
.camara { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; align-items: flex-start; justify-content: center; }
video, #vista { width: 300px; max-width: 100%; border: 2px solid #b5d2e5; border-radius: 16px; background: #eaf3f9; }
.acciones { margin-top: 22px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
#mensaje { margin-top: 16px; font-weight: bold; min-height: 1.4em; text-align: center; }
#mensaje.error { color: var(--peligro); }
#mensaje.ok { color: var(--ok); }
.tabla-scroll { overflow-x: auto; border-radius: 12px; }
table { width: 100%; border-collapse: collapse; background: #fff; }
th, td { border: 1px solid #c7dceb; padding: 11px; text-align: left; vertical-align: middle; }
th { background: #e5f3fc; color: #164f7f; }
td img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
td.acc { display: flex; gap: 8px; flex-wrap: wrap; }
td.acc button { padding: 8px 13px; font-size: 14px; }
.oculto { display: none !important; }
dialog {
  width: min(92vw, 430px);
  border: 1px solid #b9d5e9;
  border-radius: 20px;
  padding: 26px;
  color: var(--texto);
  text-align: center;
  box-shadow: 0 18px 55px rgba(10,45,80,.3);
}
dialog::backdrop { background: rgba(12,43,72,.48); }
#imgQR { max-width: 220px; width: 100%; }
@media (min-width: 760px) {
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
  .form-grid > .solo-registro { grid-column: 1 / -1; }
}
@media (max-width: 600px) {
  body { padding: 12px; }
  header { padding: 18px 14px; }
  .logo-faceaccess { width: 148px; height: 148px; }
  section { padding: 20px 16px; }
  .acciones button { flex: 1 1 100%; }
  td.acc { min-width: 190px; }
}
  </style>
</head>
<body>
  <header>
    <h1>FaceAccess · Panel de administración</h1>
    <div>
      <span id="quien"></span>
      <button class="salir" id="btnSalir">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <section>
      <h2 id="tituloForm">Registrar estudiante</h2>

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre">

      <label for="documento">Número de documento</label>
      <input type="text" id="documento">

      <div class="solo-registro">
        <div class="consentimiento">
          <label>
            <input type="checkbox" id="autorizacion">
            <span>Autorizo el uso de mis datos personales y de mi rostro para el control de ingreso, de acuerdo con la Ley 1581 de 2012. Puedo pedir que se eliminen en cualquier momento.</span>
          </label>
        </div>

        <h3>Foto del rostro</h3>
        <div class="camara">
          <video id="video" autoplay playsinline muted aria-label="Vista de la cámara"></video>
          <div>
            <button id="btnFoto" type="button">Tomar foto</button>
            <p><img id="vista" class="oculto" alt="Foto capturada"></p>
          </div>
        </div>
      </div>

      <div class="acciones">
        <button id="btnGuardar" type="button">Guardar estudiante</button>
        <button id="btnCancelar" type="button" class="gris oculto">Cancelar</button>
      </div>
      <p id="mensaje" role="alert" aria-live="assertive"></p>
    </section>

    <section>
      <h2>Estudiantes registrados</h2>
      <div class="tabla-scroll">
        <table>
          <thead><tr><th>Foto</th><th>Nombre</th><th>Documento</th><th>Acciones</th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>
  </main>

    <dialog id="dlgQR" aria-labelledby="tituloQR">
    <h2 id="tituloQR">Código QR</h2>
    <img id="imgQR" alt="">
    <p>Con este código el estudiante puede ingresar si el reconocimiento facial no funciona.</p>
    <div class="acciones" style="justify-content:center">
      <a id="descargarQR" class="boton" href="#" download="qr.png">Descargar QR</a>
      <button id="btnCerrarQR" type="button" class="gris">Cerrar</button>
    </div>
  </dialog>

  <script src="/js/face-api.js"></script>
  <script>
    let editandoId = null;     // null = registrando, número = editando ese estudiante
    let fotoBase64 = null;
    let descriptorFacial = null;   // los 128 números del rostro, calculados al tomar la foto
    let modelosListos = false;

    const el = id => document.getElementById(id);
    const video = el('video');

    function avisar(texto, tipo) {
      el('mensaje').textContent = texto;
      el('mensaje').className = tipo || '';
    }

    async function api(url, opciones) {
      const resp = await fetch(url, opciones);
      if (resp.status === 401) { window.location.href = '/login.html'; throw new Error('Sin sesión'); }
      const datos = await resp.json().catch(() => ({}));
      return { ok: resp.ok, datos };
    }

    async function verificarSesion() {
      const r = await api('/api/auth/me');
      el('quien').textContent = r.datos.nombre + ' (' + r.datos.rol + ') ';
    }

    el('btnSalir').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(() => avisar('No se pudo acceder a la cámara. Revise los permisos del navegador.', 'error'));

    // Modelos de reconocimiento facial (se cargan una sola vez)
    async function cargarModelos() {
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri('/models');
        await faceapi.nets.faceLandmark68Net.loadFromUri('/models');
        await faceapi.nets.faceRecognitionNet.loadFromUri('/models');
        modelosListos = true;
      } catch (e) {
        avisar('No se pudieron cargar los modelos de reconocimiento facial.', 'error');
      }
    }

    el('btnFoto').addEventListener('click', async () => {
      if (!video.videoWidth) { avisar('La cámara no está lista todavía.', 'error'); return; }
      if (!modelosListos) { avisar('Cargando el reconocimiento facial, intente en unos segundos.', 'error'); return; }

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      // Se busca un rostro en la foto capturada y se calcula su descriptor
      avisar('Analizando la foto…', '');
      const r = await faceapi
        .detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (!r) {   // no se detectó ningún rostro: se pide repetir la foto
        fotoBase64 = null;
        descriptorFacial = null;
        el('vista').classList.add('oculto');
        avisar('No se detectó un rostro. Acérquese, mire a la cámara y mejore la luz.', 'error');
        return;
      }

      descriptorFacial = Array.from(r.descriptor);   // Float32Array -> arreglo normal para enviarlo en JSON
      fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
      el('vista').src = fotoBase64;
      el('vista').classList.remove('oculto');
      avisar('Rostro detectado. Si la foto no se ve bien, puede tomarla de nuevo.', 'ok');
    });

    async function cargarLista() {
      const r = await api('/api/estudiantes');
      const cuerpo = el('lista');
      cuerpo.innerHTML = '';
      if (!r.datos.length) {
        const fila = cuerpo.insertRow();
        const celda = fila.insertCell();
        celda.colSpan = 4;
        celda.textContent = 'Todavía no hay estudiantes registrados.';
        return;
      }
      r.datos.forEach(e => {
        const fila = cuerpo.insertRow();

        const celdaFoto = fila.insertCell();
        if (e.tiene_foto) {
          const img = document.createElement('img');
          img.src = '/api/estudiantes/' + e.id + '/foto';
          img.alt = 'Foto de ' + e.nombre;
          celdaFoto.appendChild(img);
        }
        fila.insertCell().textContent = e.nombre;       // textContent evita inyectar HTML
        fila.insertCell().textContent = e.documento;

        const celdaAcc = fila.insertCell();
        celdaAcc.className = 'acc';
        const bQR = document.createElement('button');
        bQR.textContent = 'Ver QR';
        bQR.addEventListener('click', () => verQR(e));
        const bEditar = document.createElement('button');
        bEditar.textContent = 'Editar';
        bEditar.addEventListener('click', () => iniciarEdicion(e));
        const bEliminar = document.createElement('button');
        bEliminar.textContent = 'Eliminar';
        bEliminar.className = 'peligro';
        bEliminar.addEventListener('click', () => eliminar(e));
        celdaAcc.append(bEditar, bQR, bEliminar);      });
    }

    el('btnGuardar').addEventListener('click', async () => {
      const nombre = el('nombre').value.trim();
      const documento = el('documento').value.trim();

      if (editandoId) {
        const r = await api('/api/estudiantes/' + editandoId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, documento })
        });
        if (!r.ok) { avisar(r.datos.error, 'error'); return; }
        avisar('Estudiante actualizado correctamente.', 'ok');
      } else {
        const r = await api('/api/estudiantes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre, documento,
            autorizacion: el('autorizacion').checked,
            foto: fotoBase64,
            descriptor: descriptorFacial
          })
        });
        if (!r.ok) { avisar(r.datos.error, 'error'); return; }
        avisar('Estudiante registrado correctamente.', 'ok');
      }
      limpiarFormulario(true);
      cargarLista();
    });

    function iniciarEdicion(e) {
      editandoId = e.id;
      el('nombre').value = e.nombre;
      el('documento').value = e.documento;
      el('tituloForm').textContent = 'Editar estudiante';
      el('btnGuardar').textContent = 'Actualizar estudiante';
      el('btnCancelar').classList.remove('oculto');
      document.querySelector('.solo-registro').classList.add('oculto');
      avisar('', '');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    el('btnCancelar').addEventListener('click', () => limpiarFormulario(false));

    function limpiarFormulario(conservarMensaje) {
      editandoId = null;
      fotoBase64 = null;
      descriptorFacial = null;
      el('nombre').value = '';
      el('documento').value = '';
      el('autorizacion').checked = false;
      el('vista').classList.add('oculto');
      el('tituloForm').textContent = 'Registrar estudiante';
      el('btnGuardar').textContent = 'Guardar estudiante';
      el('btnCancelar').classList.add('oculto');
      document.querySelector('.solo-registro').classList.remove('oculto');
      if (!conservarMensaje) avisar('', '');
    }

    async function eliminar(e) {
      if (!confirm('¿Eliminar a ' + e.nombre + '? Se borrarán también su foto y su autorización.')) return;
      const r = await api('/api/estudiantes/' + e.id, { method: 'DELETE' });
      if (!r.ok) { avisar(r.datos.error, 'error'); return; }
      avisar('Estudiante eliminado.', 'ok');
      cargarLista();
    }

    function verQR(e) {
      const url = '/api/estudiantes/' + e.id + '/qr';
      el('tituloQR').textContent = 'Código QR de ' + e.nombre;
      el('imgQR').src = url;
      el('imgQR').alt = 'Código QR de ' + e.nombre;
      el('descargarQR').href = url;
      el('descargarQR').download = 'qr-' + e.documento.replace(/[^\w-]/g, '_') + '.png';
      el('dlgQR').showModal();
    }
    el('btnCerrarQR').addEventListener('click', () => el('dlgQR').close());


    cargarModelos();
    verificarSesion().then(cargarLista);
  </script>
</body>
</html>
