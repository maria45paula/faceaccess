<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceAccess · Iniciar sesión</title>
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <main>
    <h1>FaceAccess</h1>
    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" autocomplete="username">
    <label for="contrasena">Contraseña</label>
    <input id="contrasena" type="password" autocomplete="current-password">
    <button id="entrar">Iniciar sesión</button>
    <p id="mensaje" role="alert" aria-live="assertive"></p>
  </main>

  <script>
    const mensaje = document.getElementById('mensaje');

    async function iniciarSesion() {
      mensaje.textContent = '';
      const usuario = document.getElementById('usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value;

      try{
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, contrasena })
        });
        const datos = await resp.json();

        if (resp.ok) {
          window.location.href = '/panel.html';     // éxito: entra al panel
        } else {
          mensaje.textContent = datos.error;        // fallo: muestra el mensaje del servidor
        }
      } catch(error){
        mensaje.textContent='No se pudo conectar con el servidor. Intente de nuevo.'
      }
    }

    document.getElementById('entrar').addEventListener('click', iniciarSesion);
    document.getElementById('contrasena').addEventListener('keydown', e => {
      if (e.key === 'Enter'){
         iniciarSesion();
      }
    });
  </script>
</body>
</html>
