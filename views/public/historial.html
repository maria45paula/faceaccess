<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceAccess · Historial de ingresos</title>
  <style>
    :root {
      --azul: #287fbd;
      --azul-oscuro: #14558f;
      --azul-profundo: #103f70;
      --celeste: #a8e2fa;
      --texto: #17334c;
      --borde: #c5d8e8;
      --blanco: #fff;
      --peligro: #a40000;
      --ok: #08723b;
      --sombra: 0 12px 30px rgba(22, 73, 119, .16);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 40px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      background: linear-gradient(125deg, #6eabe5 0%, #8cccf1 48%, #b1eafa 100%);
    }

    .pagina { width: min(1120px, 100%); margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 20px;
      background: rgba(255,255,255,.88);
      box-shadow: var(--sombra);
      backdrop-filter: blur(8px);
    }

    .marca { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .logo {
      width: 76px; height: 76px; flex: 0 0 76px;
      display: grid; place-items: center;
      overflow: hidden;
      border: 2px solid var(--azul-profundo);
      border-radius: 50%;
      background: #fff;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    .logo-fallback { font-weight: 800; font-size: 19px; color: var(--azul-oscuro); }
    header h1 { margin: 0; color: var(--azul-profundo); font-size: clamp(20px, 3vw, 27px); }
    .subtitulo { margin: 5px 0 0; color: #55738d; font-size: 14px; }

    .cabecera-acciones {
      display: flex; align-items: center; justify-content: flex-end;
      flex-wrap: wrap; gap: 10px;
    }
    #quien { color: #476780; font-size: 14px; font-weight: 600; }

    a { color: var(--azul-oscuro); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }

    main { display: grid; gap: 22px; }
    section {
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 22px;
      background: rgba(255,255,255,.94);
      box-shadow: var(--sombra);
    }
    h2 { margin: 0 0 20px; color: var(--azul-profundo); font-size: 21px; }
    .titulo-seccion { display: flex; align-items: center; gap: 10px; }
    .titulo-icono {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 11px; background: #e4f4ff; color: var(--azul-oscuro);
      font-size: 18px;
    }

    .filtros {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 205px), 1fr));
      gap: 16px;
    }
    label { display: block; margin: 0 0 7px; color: #31536e; font-size: 14px; font-weight: 700; }
    input, select {
      width: 100%; min-height: 44px; padding: 10px 15px;
      border: 1.5px solid var(--borde); border-radius: 999px;
      outline: none; background: #fff; color: var(--texto);
      font: inherit; font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(40,127,189,.15);
    }

    button {
      min-height: 42px; padding: 10px 20px;
      border: 1px solid #0f5794; border-radius: 999px;
      background: linear-gradient(180deg, #4c9bd4, #1768a8);
      box-shadow: 0 4px 0 #104b80, 0 7px 13px rgba(15,78,130,.18);
      color: #fff; cursor: pointer;
      font: inherit; font-size: 15px; font-weight: 700;
      transition: transform .15s, filter .15s;
    }
    button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #104b80; }
    button.salir {
      border-color: #b9d4e8; background: #fff; color: var(--azul-oscuro);
      box-shadow: 0 3px 0 #d0e0ec;
    }
    button.gris {
      border-color: #718da4; background: linear-gradient(180deg, #8ca4b8, #607d95);
      box-shadow: 0 4px 0 #4e667a;
    }
    :focus-visible { outline: 3px solid #ffb000; outline-offset: 3px; }

    .acciones { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 20px; }
    #total {
      min-height: 1.4em; margin: -7px 0 16px;
      color: #456780; font-size: 14px; font-weight: 700;
    }

    .tabla-scroll {
      overflow-x: auto;
      border: 1px solid #d5e4ef;
      border-radius: 14px;
    }
    table { width: 100%; border-collapse: collapse; min-width: 680px; }
    th, td { padding: 13px 14px; border-bottom: 1px solid #e1ebf2; text-align: left; vertical-align: middle; }
    th { background: #eaf6ff; color: var(--azul-profundo); font-size: 13px; letter-spacing: .02em; }
    td { color: #294960; font-size: 14px; }
    tbody tr:nth-child(even) { background: #f8fcff; }
    tbody tr:hover { background: #eef8ff; }
    tbody tr:last-child td { border-bottom: 0; }
    td.permitido { color: var(--ok); font-weight: 700; }
    td.denegado { color: var(--peligro); font-weight: 700; }
    .nota { margin: 14px 0 0; color: #678198; font-size: 13px; }

    @media (max-width: 620px) {
      body { padding: 14px 10px 28px; }
      header { align-items: flex-start; padding: 14px; }
      .logo { width: 60px; height: 60px; flex-basis: 60px; }
      .cabecera-acciones { width: 100%; justify-content: flex-start; }
      #quien { width: 100%; }
      section { border-radius: 17px; }
      .acciones button { flex: 1 1 150px; }
    }
  </style>
  <link rel="stylesheet" href="/css/accesibilidad.css">
  <script src="/js/accesibilidad.js"></script>
</head>
<body>
  <header>
    <h1>FaceAccess · Historial de ingresos</h1>
    <div>
      <span id="quien"></span>
      <a href="/panel.html">Volver al panel</a>
      <button class="salir" id="btnSalir">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <section aria-labelledby="tituloFiltros">
      <h2 id="tituloFiltros">Filtrar ingresos</h2>
      <form id="formFiltros">
        <div class="filtros">
          <div><label for="desde">Desde</label><input type="date" id="desde"></div>
          <div><label for="hasta">Hasta</label><input type="date" id="hasta"></div>
          <div>
            <label for="metodo">Método</label>
            <select id="metodo">
              <option value="">Todos</option>
              <option value="rostro">Reconocimiento facial</option>
              <option value="qr">Código QR</option>
              <option value="documento">Documento</option>
            </select>
          </div>
          <div>
            <label for="resultado">Resultado</label>
            <select id="resultado">
              <option value="">Todos</option>
              <option value="permitido">Permitido</option>
              <option value="denegado">Denegado</option>
            </select>
          </div>
          <div><label for="estudiante">Estudiante (nombre o documento)</label><input type="text" id="estudiante" autocomplete="off"></div>
        </div>
        <div class="acciones">
          <button type="submit">Buscar</button>
          <button type="button" id="btnLimpiar" class="gris">Limpiar filtros</button>
        </div>
      </form>
    </section>
    
    <section aria-labelledby="tituloLista">
      <h2 id="tituloLista">Ingresos registrados</h2>
      <p id="total" aria-live="polite"></p>
      <div class="tabla-scroll">
        <table aria-labelledby="tituloLista">
          <thead>
            <tr><th scope="col">Fecha y hora</th><th scope="col">Estudiante</th><th scope="col">Documento</th>
                <th scope="col">Método</th><th scope="col">Resultado</th></tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p>Se muestran como máximo los 500 ingresos más recientes.</p>
    </section>
  </main>

  <script>
    const el = id => document.getElementById(id);
    const METODOS = { rostro: 'Reconocimiento facial', qr: 'Código QR', documento: 'Documento' };

    // Llamada a la API; si la sesión venció, vuelve al login
    async function api(url, opciones) {
      const resp = await fetch(url, opciones);
      if (resp.status === 401) { window.location.href = '/login.html'; throw new Error('Sin sesión'); }
      const datos = await resp.json().catch(() => ({}));
      return { ok: resp.ok, datos };
    }

    async function verificarSesion() {
      const r = await api('/api/auth/me');
      el('quien').textContent = r.datos.nombre + ' (' + r.datos.rol + ') ';
    }

    el('btnSalir').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    function filtrosActivos() {
      const q = new URLSearchParams();
      ['desde', 'hasta', 'metodo', 'resultado', 'estudiante'].forEach(id => {   // el id de cada campo = nombre del filtro
        const valor = el(id).value.trim();
        if (valor) q.set(id, valor);
      });
      return q;
    }



    async function cargarHistorial() {
      const filtros = filtrosActivos();
      const r = await api('/api/historial' + (filtros.toString() ? '?' + filtros : ''));
      const cuerpo = el('lista');
      cuerpo.innerHTML = '';

      if (!r.ok) {
        el('total').textContent = r.datos.error || 'No se pudo cargar el historial.';
        return;
      }
      el('total').textContent = r.datos.length + (r.datos.length === 1 ? ' ingreso' : ' ingresos');

      if (!r.datos.length) {
        const celda = cuerpo.insertRow().insertCell();
        celda.colSpan = 5;
        celda.textContent = filtros.toString() ? 'No hay ingresos que coincidan con los filtros.' : 'Todavía no hay ingresos registrados.';
        return;
      }

      r.datos.forEach(i => {
        const fila = cuerpo.insertRow();
        fila.insertCell().textContent = i.fecha_hora;      // textContent evita inyectar HTML
        // Sin nombre: o fue un intento no reconocido, o el estudiante se eliminó después de ingresar
        fila.insertCell().textContent = i.nombre || (i.resultado === 'permitido' ? 'Estudiante eliminado' : 'No identificado');
        fila.insertCell().textContent = i.documento || '—';
        fila.insertCell().textContent = METODOS[i.metodo] || i.metodo;
        const celdaResultado = fila.insertCell();
        celdaResultado.textContent = i.resultado === 'permitido' ? '✔ Permitido' : '✘ Denegado';   // ícono + texto
        celdaResultado.className = i.resultado;
      });
    }

    el('formFiltros').addEventListener('submit', e => {   // submit permite usar también la tecla Enter
      e.preventDefault();
      cargarHistorial();
    });
    el('btnLimpiar').addEventListener('click', () => {
      el('formFiltros').reset();
      cargarHistorial();
    });

    verificarSesion().then(cargarHistorial);
    
    
  </script>
</body>
</html>
