<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- SCRUM-30: el viewport hace que la página se adapte al celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceAccess · Ingreso</title>
  <style>
    :root { --texto:#111; --borde:#444; --primario:#0b4f8a; --ok:#0a6b2d; --error:#a40000; --info:#e8eef5; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; font-size: 20px; color: var(--texto); margin: 0; padding: 16px; background: #fff; }
    main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    h1 { margin: 0; font-size: 28px; text-align: center; }
    video { width: 100%; border: 3px solid var(--borde); border-radius: 12px; background: #ddd; }
    button { font-size: 24px; padding: 16px; border: 0; border-radius: 10px; background: var(--primario); color: #fff; cursor: pointer; }
    button:disabled { background: #777; cursor: not-allowed; }
    :focus-visible { outline: 4px solid #ffb000; outline-offset: 2px; }

    .resultado { border-radius: 12px; padding: 20px; text-align: center; border: 3px solid var(--borde); background: var(--info); }
    .resultado.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    .resultado.error { background: var(--error); color: #fff; border-color: var(--error); }
    .resultado .icono { font-size: 64px; line-height: 1; }
    .resultado .titulo { font-size: 40px; font-weight: bold; margin: 8px 0; }
    .resultado .detalle { font-size: 22px; margin: 0; }
    #tiempo { text-align: center; font-size: 16px; color: #333; min-height: 1.2em; }
    .nota { font-size: 16px; text-align: center; color: #333; }
    </style>
</head>
<body>
        <main>
            <h1>FaceAccess · Ingreso</h1>
            <video id="video" autoplay playsinline muted arial-label="vista de la camara"></video>
            <button id="btnVerificar" disabled>Verificar Identidad</button>
            <div id="resultado" class="resultado info" role="alert" aria-live="assertive">
                <div class="icono" id="icono">..</div>
                <div class="titulo" id="titulo">Cargando..</div>
                <p class="detalle" id="detalle">Preparando el sistema</p>
            </div>

            <div id="tiempo"></div>
            <p class="nota">Si el reconocimiento facial no funciona se utilizara otro metodo</p>
            <p class="nota"><a href="/login.html">Acceso del personal</a></p>
        </main>

        <script src="/js/face-api.js"></script>
        <script>
            const el= id => document.getElementById(id);
            const video =el('video');
            const btn =el('btnVerificar');
            const TIEMPO_MAXIMO_BUSQUEDA=10000;
            const META_RAPIDEZ =3000;
            let modelosListos=false;
            let camaraLista=false;

            const dormir =ms => new Promise(r=> setTimeout(r, ms));


            //Seccion para mostrar un mensaje grande ya sea error, info, ok
            function mostrar(tipo, titulo,detalle){
                el('resultado').className = 'resultado ' + tipo;
                el('icono').textContent = tipo === 'ok' ? '✔' : tipo === 'error' ? '✘' : '…';
                el('titulo').textContent = titulo;
                el('detalle').textContent = detalle || '';
            }
